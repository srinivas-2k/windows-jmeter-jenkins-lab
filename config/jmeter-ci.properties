# ---------------------------------------------------------------------------
# JMeter properties used for EVERY CI run (passed with:  -q config\jmeter-ci.properties)
# Why a file instead of editing JMeter's own bin\user.properties?
#   - it lives in Git, so every agent runs with identical settings (reproducibility)
#   - upgrading JMeter never overwrites it
# ---------------------------------------------------------------------------

# Results file format: CSV is small, fast to write and is what the HTML dashboard,
# the Performance plugin and scripts\validate-jtl.ps1 all read.
jmeter.save.saveservice.output_format=csv

# Fields the HTML dashboard needs (these are the 5.6.3 defaults, written out so students see them)
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.assertion_results_failure_message=true
# Keep response bodies OUT of the JTL - they make files huge and slow the load generator.
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false

# Dashboard: the default graph granularity is 60 000 ms. A 60-second test would then show
# ONE point per graph. 5 s gives readable over-time graphs for short CI tests (must be > 1000).
jmeter.reportgenerator.overall_granularity=5000

# Apdex thresholds (ms) shown on the dashboard. Keep them aligned with the quality gate.
jmeter.reportgenerator.apdex_satisfied_threshold=500
jmeter.reportgenerator.apdex_tolerated_threshold=1500

# Report title shown on the dashboard
jmeter.reportgenerator.report_title=ShopLite - JMeter CI Dashboard

# Print a summary line to the console every 10 s so the Jenkins log shows progress.
summariser.name=summary
summariser.interval=10
summariser.out=true
